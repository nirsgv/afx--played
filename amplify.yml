version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 24 && nvm use 24
        # Not `npm ci`: npm 11 rejects this lockfile because of packages bundled
        # inside @aws-amplify/*-construct, even when freshly generated.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
